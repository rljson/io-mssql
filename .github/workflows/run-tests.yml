# This workflow will do a clean installation of node dependencies,
# cache/restore them, build the source code and run tests across different
# versions of node

name: Tests

on:
  workflow_dispatch:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: Password123!
          MSSQL_PID: Developer
        ports:
          - 1431:1433
    steps:
    
      - name: Checkout code
        uses: actions/checkout@v5

      # Only this check needs sqlcmd, so it runs inside the SQL Server
      # container, which ships its own. Nothing is installed on the runner,
      # whatever Ubuntu release it has. Newer images keep sqlcmd 18 in
      # mssql-tools18 (-C trusts the self-signed certificate), older ones in
      # mssql-tools.
      - name: Wait for MSSQL to be ready
        env:
          MSSQL_CONTAINER: ${{ job.services.mssql.id }}
        run: |
          echo "Waiting for MSSQL to start..."
          for i in {1..30}; do
            if docker exec "$MSSQL_CONTAINER" bash -c '
              if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then
                /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" -Q "SELECT 1"
              else
                /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -Q "SELECT 1"
              fi'; then
              exit 0
            fi
            echo "MSSQL not ready yet... ($i)"
            sleep 2
          done
          echo "MSSQL did not become ready"
          exit 1

      - name: Test MSSQL connection
        run: |
          echo "Testing MSSQL connection..."
          # Optional: install sqlcmd and test connection
      # Corepack aktivieren, um sicherzustellen, dass pnpm funktioniert
      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Cache pnpm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      - run: pnpm test
