# This workflow will do a clean installation of node dependencies,
# cache/restore them, build the source code and run tests across different
# versions of node

name: Tests

on:
  workflow_dispatch:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: Password123!
          MSSQL_PID: Developer
        ports:
          - 1431:1433
    steps:
    
      - name: Checkout code
        uses: actions/checkout@v5

      # apt-key is gone from current Ubuntu runners: keep the Microsoft key in
      # its own keyring and take the package list of the runner's release.
      - name: Install MSSQL tools (sqlcmd)
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          . /etc/os-release
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/${VERSION_ID}/prod ${VERSION_CODENAME} main" \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"

      # sqlcmd 18 encrypts by default; -C trusts the self-signed certificate
      # of the service container.
      - name: Wait for MSSQL to be ready
        run: |
          echo "Waiting for MSSQL to start..."
          for i in {1..30}; do
            if sqlcmd -C -S localhost,1431 -U sa -P 'Password123!' -Q "SELECT 1"; then
              exit 0
            fi
            echo "MSSQL not ready yet... ($i)"
            sleep 2
          done
          echo "MSSQL did not become ready"
          exit 1

      - name: Test MSSQL connection
        run: |
          echo "Testing MSSQL connection..."
          # Optional: install sqlcmd and test connection
      # Corepack aktivieren, um sicherzustellen, dass pnpm funktioniert
      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Cache pnpm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      - run: pnpm test
